name: Build Android + Rust Native Skeleton

on:
  # Run manually to avoid a notification for every tiny commit.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          targets: aarch64-linux-android

      - name: Install NDK
        env:
          ANDROID_SDK_ROOT: ${{ runner.tool_cache }}/android-sdk
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          cd "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -sSL -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;27.3.13750724" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.3.13750724" >> "$GITHUB_ENV"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Verify dictionary asset matches word list
        run: |
          python3 tools/build_dictionary.py
          git diff --exit-code -- app/src/main/assets/keyboard_dictionary.bin

      - name: Run Rust tests
        working-directory: rust-core
        run: cargo test

      - name: Build Rust Android library
        working-directory: rust-core
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_HOME"
          cargo ndk -t aarch64-linux-android build --release
          mkdir -p ../app/src/main/jniLibs/arm64-v8a
          cp target/aarch64-linux-android/release/libkeyboard_core.so ../app/src/main/jniLibs/arm64-v8a/

      - name: Run Android unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build Android APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk