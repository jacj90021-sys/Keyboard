name: Build Android + Rust Native Skeleton

on:
  # Build every push to the working branch, and allow manual runs.
  push:
    branches: [full-project]
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # The deliverable: a real, signed debug APK with the Rust core cross-compiled
  # in. This job must stay green; it is what turns "written" into "built".
  # ---------------------------------------------------------------------------
  apk:
    name: Rust core + Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          # `target` (singular) is the real input name; the old `targets` was
          # silently ignored, so the Android targets were never installed.
          target: aarch64-linux-android,x86_64-linux-android
          components: rustfmt, clippy
          # Do not turn every dependency warning into a hard error for the
          # cross build. Our own code is lint-gated by the clippy step below.
          rustflags: ""

      - name: Resolve Android SDK and NDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then SDK=/usr/local/lib/android/sdk; fi
          NDK="${ANDROID_NDK_ROOT:-}"
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
            NDK="$(find "$SDK/ndk" -maxdepth 1 -mindepth 1 -type d 2>/dev/null | sort -V | tail -1 || true)"
          fi
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
            echo "No preinstalled NDK found; installing one..."
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" "ndk;27.3.13750724" >/dev/null
            NDK="$SDK/ndk/27.3.13750724"
          fi
          {
            echo "ANDROID_SDK_ROOT=$SDK"
            echo "ANDROID_HOME=$SDK"
            echo "ANDROID_NDK_HOME=$NDK"
            echo "ANDROID_NDK_ROOT=$NDK"
          } >> "$GITHUB_ENV"
          echo "Resolved SDK: $SDK"
          echo "Resolved NDK: $NDK"
          rustup target add aarch64-linux-android x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Verify dictionary asset matches word list
        run: |
          python3 -m pip install --quiet numpy tflite
          python3 -m unittest discover -s tools -p "test_*.py"
          python3 tools/build_dictionary.py
          git diff --exit-code -- app/src/main/assets/keyboard_dictionary.bin

      - name: Run Rust tests and lints
        working-directory: rust-core
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: Build Rust Android library
        working-directory: rust-core
        run: |
          cargo ndk -t aarch64-linux-android -t x86_64-linux-android build --release
          mkdir -p ../app/src/main/jniLibs/arm64-v8a ../app/src/main/jniLibs/x86_64
          cp target/aarch64-linux-android/release/libkeyboard_core.so ../app/src/main/jniLibs/arm64-v8a/
          cp target/x86_64-linux-android/release/libkeyboard_core.so ../app/src/main/jniLibs/x86_64/
          ls -l ../app/src/main/jniLibs/*/

      - name: Build Android APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Host-side JVM tests. Kept as its own job and non-blocking because the
  # heavyweight Robolectric + Compose interaction tests currently hit the
  # known Robolectric/Espresso idling incompatibility (AppNotIdleException).
  # The APK must not be held hostage by that; the tests stay visible here.
  # TODO: migrate KeyboardInteractionTest off Espresso-driven idling.
  # ---------------------------------------------------------------------------
  unit-tests:
    name: Android unit tests (Robolectric)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Ensure Android SDK is on the environment
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          {
            echo "ANDROID_SDK_ROOT=$SDK"
            echo "ANDROID_HOME=$SDK"
          } >> "$GITHUB_ENV"

      - name: Run Android unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
